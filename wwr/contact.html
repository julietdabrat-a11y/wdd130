<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Everest Whitewater Expeditions</title>
    <meta name="description" content="Contact Everest Whitewater Expeditions for rafting trip questions, bookings, address, phone number, and email.">
    <meta name="author" content="Juliet Dabrat">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-rapids-trees.jpg" alt="Everest Whitewater Expeditions Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="contact-info">
            <h1>Contact Us - Everest Whitewater Expeditions</h1>
            <p>123 River Expedition Road, Jinja, Uganda</p>
            <p>+256 704757317 | +256 785192322 | +256 789912118</p>
            <p>julietdabrat@gmail.com</p>
        </section>

        <div class="contact-grid">
            <div class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d15928.132935340962!2d33.187578154084456!3d0.4252600636999549!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sug!4v1795763775885!5m2!1sen!2sug" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" title="Map showing Everest Whitewater Expeditions location">
                </iframe>
            </div>

            <form class="contact-form" action="#" method="post">
                <div class="form-row">
                    <label for="fullname">Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Your full name" required>
                </div>

                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <fieldset class="purpose-group">
                    <legend>Message Purpose</legend>
                    <label for="purpose-general">
                        <input type="radio" id="purpose-general" name="purpose" value="general" checked>
                        General Inquiry
                    </label>
                    <label for="purpose-reservation">
                        <input type="radio" id="purpose-reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>
                    <label for="purpose-suggestion">
                        <input type="radio" id="purpose-suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="form-row">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Type your message here..." required></textarea>
                </div>

                <div class="checkbox-row">
                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                        Please subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit" class="submit-btn">Get in Touch!</button>
            </form>
        </div>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-gallery">
                <figure>
                    <img src="images/profile.jpg" alt="Juliet Dabrat, Lead River Guide">
                    <figcaption>Juliet Dabrat — Lead River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee1.jpg" alt="Micheal Reno, Trip Coordinator">
                    <figcaption>Micheal Reno — Trip Coordinator</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Charles Darwin, Safety & Gear Manager">
                    <figcaption>Charles Darwin — Safety &amp; Gear Manager</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Everest Whitewater Expeditions | Juliet Dabrat</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank">
                <img src="images/facebook.svg" alt="Facebook">
            </a>
            <a href="https://twitter.com" target="_blank">
                <img src="images/twitter.png" alt="Twitter">
            </a>
            <a href="https://instagram.com" target="_blank">
                <img src="images/instagram.svg" alt="Instagram">
            </a>
        </nav>
    </footer>
</body>

</html>
